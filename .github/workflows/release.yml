name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Determine next version
        id: version
        run: bash .github/scripts/determine-version.sh

      - name: Set project version
        if: steps.version.outputs.should_release == 'true'
        run: |
          sed -i "s/^version = .*/version = '${{ steps.version.outputs.version_number }}'/" build.gradle

      - name: Rebuild with release version
        if: steps.version.outputs.should_release == 'true'
        run: ./gradlew build --no-daemon

      - name: Commit version bump
        if: steps.version.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.gradle
          git commit -m "chore: release ${{ steps.version.outputs.new_version }} [skip release]"
          git push origin HEAD:main

      - name: Create tag
        if: steps.version.outputs.should_release == 'true'
        run: |
          git tag ${{ steps.version.outputs.new_version }}
          git push origin ${{ steps.version.outputs.new_version }}

      - name: Create GitHub release
        if: steps.version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.new_version }}
          name: ${{ steps.version.outputs.new_version }}
          generate_release_notes: true
          files: build/libs/*.jar
